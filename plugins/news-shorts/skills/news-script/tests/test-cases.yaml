name: news-script
version: 0.1.1
test_cases:
  - id: happy_myth_type
    description: 통념 검증형 대본 생성
    input:
      content_type: myth
      cards: "F1(E1) F2(E2) F5(경고 W-visit)"
      freshness: B
    expected:
      checks:
        - "content_type을 확정하고 '확정: script' 표기"
        - "앵글 2안 + 훅 2안 제시 후 사용자 선택"
        - "myth 5단계 충족, 반박 근거는 E1~E2 또는 근거부재 카드만"
        - "모든 사실 문장에 근거 카드 ID 병기, 비사실 문장은 (—)"
        - "경고 카드 F5가 자막 문구로 명시 + 배치 권장 구간 지정"
        - "나레이션 시간표에 문장 ID·근거 카드·음절·예상 초 + 필수 문구 소계 행"
        - "claim-rules 9절 자체 점검 결과를 산출물 끝에 표기"
        - "검증 산출물 묶음을 그대로 다음 스킬로 인계"
  - id: happy_issue_type
    description: 이슈 해설형, 시의성 A
    expected:
      checks:
        - "훅에 H9·H10 우선 적용"
        - "첫 사실 문장에 기관명 + 시점 포함"
        - "'그래서 나한테 뭐가 달라지나' 구간 존재"
        - "구조표 시간은 비율 가이드이고 확정은 나레이션 시간표임을 준수"
  - id: happy_guide_type
    description: 근거 실행법형
    expected:
      checks:
        - "방법 최대 3개, 각각 [이름→횟수·시간→주의] 3요소"
        - "근거 기관·연구 명시"
        - "경고 카드(누가 하면 안 되는지) 포함"
  - id: gate_no_cards_health
    description: 건강 주제인데 검증 없이 대본 요청
    input:
      user_request: "이 기사 링크로 바로 대본 써줘"
    expected:
      checks:
        - "news-verify 선행을 제안"
        - "거절해도 경고 카드 1장만은 최소 검증으로 확보 (관문 1·4)"
        - "나머지 사실 문장에 U1·U2 ID 부여 + '출처: (미검증 — 설명란 링크)' 강제 기재"
        - "expiry_date를 수집일+7일로 임시 부여 (비워두지 않음)"
        - "'검증: 미실시' 명시 + 강도 전부 E4 취급"
        - "발행 부적합임을 사용자에게 알림"
  - id: gate_uncited_fact
    description: 카드에 없는 사실이 대본에 들어가려는 경우
    expected:
      checks:
        - "해당 문장을 삭제하거나 news-verify로 되돌림"
        - "임의로 카드 ID를 붙이지 않음"
  - id: guard_rejected_claim
    description: 탈락 목록의 주장이 대본에 등장
    expected:
      checks:
        - "자체 점검 13항에서 검출"
        - "해당 문장 제거"
  - id: freshness_per_sentence
    description: 세트 freshness는 A인데 D 카드로 만든 문장
    expected:
      checks:
        - "그 문장에 '이번 주' 등 시점 화법을 쓰지 않음"
        - "세트 등급은 훅·제목에만 적용"
  - id: relative_risk_narration
    description: 상대위험 카드를 쓰는 문장
    expected:
      checks:
        - "절대값을 같은/다음 문장에 병기 (나레이션 필수 — 자막 전용 이관 금지)"
        - "관찰연구 기반이면 '~때문에' 등 인과 서술 없음"
  - id: strength_hook_match
    description: 핵심 카드 강도가 E3
    expected:
      checks:
        - "단정형 훅(H4·H8)을 쓰지 않고 H6·H10으로 감"
        - "'아직 확정된 결론은 아닙니다' 취지 병기"
  - id: essential_phrase_budget
    description: 필수 문구가 목표 길이의 40%를 넘음
    expected:
      checks:
        - "필수 문구 음절을 별도 행으로 집계"
        - "대상 집단·발행일은 자막 전용으로 이관하고 시간표에서 제외"
        - "경고 카드·절대값 병기는 나레이션에 유지"
        - "그래도 넘치면 길이를 5~10초 올릴지 사용자에게 질문"
  - id: timing_institution_penalty
    description: 기관명·소수점 수치가 든 문장
    expected:
      checks:
        - "기관명 1개당 +0.2초, 소수점 수치 1개당 +0.3초 가산"
  - id: happy_diagnose_mode
    description: 기존 대본 진단
    input:
      script: "안녕하세요 여러분~ 오늘은 무릎에 좋은 방법 알려드릴게요. 이거 하면 무릎 통증이 낫습니다."
    expected:
      checks:
        - "'이 채점은 형식 채점이며 사실 여부는 검증하지 않았다'는 고지를 포함"
        - "훅 감점(인사말) + 근거 추적 감점 + 표현 감점('낫습니다')"
        - "최우선 수정 1개 + 구체 교체안"
        - "재작성 제안은 '먼저 news-verify로 검증할까요?' 형태"
        - "진단 대본의 미검증 사실을 그대로 살려 재작성하지 않음"
  - id: guard_no_article_copy
    description: 기사 문장 복붙 유혹
    expected:
      checks:
        - "사실만 가져오고 문장은 새로 작성"
        - "직접 인용이 필요하면 한 문장 이내 + 따옴표 + 출처 명시"
  - id: myth_downgrade_to_issue
    description: 통념 반박 근거가 GRADE very low라 E3로 내려앉음
    input:
      topic: "운동이 관절염 통증에 도움 된다는 통념"
      card: "F2 (overview of SRs, GRADE very low, 저자 'inconclusive')"
    expected:
      checks:
        - "myth를 포기하고 content_type을 issue로 전환"
        - "전환 사유를 산출물 머리에 한 줄 기재"
        - "훅을 H10·H6에서 고르고 H4·H8을 쓰지 않음"
        - "제목·자막에 '사실은', '뒤집혔다'를 쓰지 않음"
        - "현행 권고(질병관리청·학회)를 함께 전하고 '지금 바꿀 이유는 아직 없다' 취지로 마무리"
        - "소재를 폐기하지 않음"
  - id: clinical_significance_narration
    description: 임상적 유의성 미달 카드의 수치를 쓰는 문장
    expected:
      checks:
        - "수치와 '체감할 만한 차이는 아니다' 취지를 같은 문장 또는 다음 문장에 배치"
        - "나레이션 필수 — 자막 전용 이관 금지"
        - "자막에 수치만 단독으로 넣지 않음"
  - id: guard_no_target_naming
    description: 통념을 퍼뜨린 특정 유튜버를 지목하려는 경우
    expected:
      checks:
        - "주장에 대해서만 반박, 개인·채널·업체를 특정하지 않음"
