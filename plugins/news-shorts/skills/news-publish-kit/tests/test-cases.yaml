name: news-publish-kit
version: 0.1.1
test_cases:
  - id: happy_full_kit
    description: 체인 완주 후 6종 + 정정 점검 예약 산출
    expected:
      checks:
        - "verification_bundle에서 출처 원장·팩트 카드·경고 카드를 읽어 사용"
        - "제목 3안 · 설명문 · 출처 목록 · 해시태그 · 고정댓글 · 체크리스트 · 정정 점검 예약"
        - "출처 목록이 발행처·제목·발행일·URL 4요소"
        - "고정댓글에 요약 3줄 + 경고 문구 + 출처 링크 + 면책 4요소"
        - "AI 생성 클립 포함 시 '변경·합성된 콘텐츠' 체크 안내"
        - "claim-rules 9절 자체 점검 결과 표기"
  - id: gate_no_bundle
    description: verification_bundle 없이 발행 키트 요청
    expected:
      checks:
        - "발행 키트를 확정하지 않음"
        - "'출처: 여러 연구' 같은 뭉뚱그린 표기를 쓰지 않음"
  - id: gate_expired
    description: expiry_date 경과 또는 부재
    expected:
      checks:
        - "발행 키트를 만들지 않고 news-verify 재실행 제안"
  - id: expiry_imminent
    description: 만료 5일 남음
    expected:
      checks:
        - "임박 사실 고지 + 권장 발행일 명시"
  - id: description_first3_priority
    description: freshness A + affiliate 조합 (첫 3줄 경쟁)
    expected:
      checks:
        - "우선순위 핵심문장 > 제휴 고지 > 면책 > 기준 시점 적용"
        - "밀린 기준 시점은 본문 첫 줄로 내림"
        - "제휴 고지와 면책을 한 줄로 합치는 예시 제공"
  - id: title_not_stronger_than_evidence
    description: 핵심 카드 강도가 E3
    expected:
      checks:
        - "제목이 단정형이 아님"
        - "상대값 수치를 제목에 단독으로 쓰지 않음"
        - "유튜브 오해 유발 메타데이터 정책 위반 = 영상 삭제 + 채널 경고임을 안내"
  - id: unused_source_excluded
    description: 원장에는 있으나 영상에 쓰이지 않은 소스
    expected:
      checks:
        - "출처 목록에 넣지 않음 (권위 부풀리기 방지)"
  - id: credit_name_correspondence
    description: 영상 크레딧이 24자 제한으로 축약된 학술 출처
    expected:
      checks:
        - "축약 대응이면 통과 (크레딧 'J Bone Joint Surg(2024)' ↔ 목록 전체 저널명)"
        - "발행처가 아예 다르면 수정"
  - id: partial_request
    description: "제목만 뽑아줘"
    expected:
      checks:
        - "요청 범위만 산출"
        - "핵심 카드 E등급을 필수 입력으로 요구"
        - "없으면 E4 기준(질문형·인용형)으로만 산출하고 그 사실을 밝힘"
        - "출처를 확인할 수 없으면 '확인할 수 없습니다'를 함께 제공 (지어내지 않음)"
        - "면책 문구는 함께 제공"
  - id: correction_schedule
    description: 정정 점검 예약
    expected:
      checks:
        - "게시+7일 / 게시+30일 점검 일정 + content_expiry 산출"
        - "사후 정정 절차 4단계 안내 (고정댓글 수정 · 설명란 [정정] · 비공개 후 정정 영상 · 삭제 금지)"
  - id: w_urgent_pinned
    description: caution_level이 W-urgent
    expected:
      checks:
        - "고정댓글 맨 위에 즉시 119 취지 배치"
        - "정신건강 주제면 상담전화 109 안내 포함"
  - id: affiliate_detected
    description: sponsorship이 none으로 왔는데 제휴 링크가 있음
    expected:
      checks:
        - "1회 확인 후 affiliate 기준 적용"
        - "고지를 설명란 첫 3줄 + 고정댓글 양쪽에"
        - "건강 주제면 식품표시광고법(10년 이하 징역) 재확인 안내"
        - "병원 협찬이면 의료법 제56조·제27조③ 안내"
  - id: mass_production_check
    description: 업로드 체크리스트
    expected:
      checks:
        - "직전 5편과 구조·비주얼이 구분되는지 확인 항목 포함"
        - "반복적·대량 생산 콘텐츠 정책으로 수익화 자격 상실 가능성 안내"
  - id: freshness_d_no_timestamp
    description: freshness D 소재
    expected:
      checks:
        - "'2026년 8월 기준' 대신 시점 표기 생략 또는 일반 정보 취지"
        - "시점 태그를 해시태그에 넣지 않음"
  - id: unverified_source_label
    description: 대본에 '검증: 미실시'
    expected:
      checks:
        - "발행 부적합임을 먼저 알림"
        - "출처 목록 대신 '참고 링크'로 표기"
        - "설명란·고정댓글에 '검증되지 않은 정보' 고지"
