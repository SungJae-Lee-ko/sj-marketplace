name: news-storyboard
version: 0.1.0
test_cases:
  - id: happy_full_chain
    description: 대본·카드·시간표를 모두 받은 정상 스토리보드
    expected:
      checks:
        - "고정 10컬럼 씬 표 산출 (role·출처 크레딧 포함)"
        - "씬 시간표에 role·근거 카드 컬럼 포함, 배정 초 합계 = 대본 총 길이"
        - "팩트 카드 ↔ 씬 매핑표 산출"
        - "체인 값 줄(content_type·freshness·expiry_date·content_expiry·씬 비중·경고 카드 씬·등급) 명시"
        - "AI 프롬프트에 no text, no logos, no on-screen numbers 포함"
        - "검증 산출물 묶음을 그대로 다음 스킬로 인계"
  - id: subtitle_self_check
    description: 자막 컬럼 표현 점검
    input:
      narration: "도움이 된다는 연구가 있습니다"
      subtitle_draft: "통증 싹 사라짐"
    expected:
      checks:
        - "claim-rules 9절을 자막 컬럼 전체에 실행"
        - "자막이 나레이션 근거 강도를 넘는 것을 검출해 수정"
        - "점검 결과를 체인 값 줄 아래에 기재"
  - id: relative_risk_subtitle
    description: 상대값 수치를 자막에 띄우려는 경우
    expected:
      checks:
        - "'위험 50%↓' 단독 자막 금지"
        - "'2%→1%' 절대값 병기 형태로 수정"
  - id: role_assignment
    description: role 컬럼 부여
    expected:
      checks:
        - "7종 영문 키(hook/context/data_card/evidence/demo/caution/cta) 중 하나로 고정"
        - "대본 구간 ↔ role 매핑 기준을 따름"
        - "실촬영 경로에도 role을 부여 (video-gen을 거치지 않으므로 여기서 만들어야 함)"
  - id: gate_credit_required
    description: 팩트 카드를 소비하는 씬인데 출처 크레딧이 비어 있음
    expected:
      checks:
        - "그 씬의 출처 크레딧을 카드의 화면 표기 문구로 채움"
        - "채울 수 없으면 대본·검증 단계로 되돌림"
  - id: companion_card_check
    description: F1을 썼는데 동반 필수 카드 F5가 어느 씬에도 없음
    expected:
      checks:
        - "카드↔씬 매핑표에서 검출"
        - "F5를 배치하거나 되돌림"
  - id: myth_quote_marks
    description: myth 유형의 통념 씬 자막
    expected:
      checks:
        - "통념 자막이 따옴표로 인용 처리됨"
        - "반박 씬과 인접 배치 + ❌/⭕ 구분"
  - id: guide_count_subtitle
    description: guide 유형의 동작 씬
    expected:
      checks:
        - "횟수·시간 카운트 자막이 자막 컬럼에 존재"
        - "정면·측면 2각도 확보, demo 씬 비중 40% 이상"
  - id: issue_data_scene_ratio
    description: issue 유형
    expected:
      checks:
        - "data_card + evidence 씬 40% 이상"
  - id: static_scene_exception
    description: data_card 씬의 나레이션이 5.5초
    expected:
      checks:
        - "3초 규칙을 배경 변경이 아니라 자막 전환으로 충족"
        - "자막을 ' / '로 쪼개 3초 이내 단위 전환, 배경 유지"
        - "출처 크레딧은 통으로 유지"
  - id: expired_input
    description: expiry_date가 지난 입력
    expected:
      checks:
        - "스토리보드를 시작하지 않고 news-verify 재실행 제안"
  - id: scene_length_exception
    description: 한 문장이 5.5초인 씬
    expected:
      checks:
        - "문장을 쪼개지 않고 6초까지 허용, 씬 안에서 앵글·줌 1회 변경"
        - "6초 초과면 news-script로 되돌려 문장 분할"
        - "분할로 늘어난 호흡 0.4초는 인접 브리지 씬에서 회수"
        - "2회 왕복 후에도 초과하면 목표 길이 상향을 사용자에게 질문"
  - id: bridge_scene_length
    description: 나레이션 없는 브리지 씬
    expected:
      checks:
        - "1.5~3초 범위 (씬 분할 규칙과 씬 시간표 규칙이 동일)"
  - id: caution_urgent_scene
    description: W-urgent 경고 카드
    expected:
      checks:
        - "role: caution 씬 배치"
        - "전체 정지 화면 + 최대 폰트 지정"
        - "나레이션도 함께 배치"
  - id: data_card_no_text_gen
    description: 수치가 화면에 뜨는 씬 설계
    expected:
      checks:
        - "배경만 생성하도록 지시, 글자·숫자 자리는 비움"
        - "수치·크레딧은 조립 자막 레이어가 담당함을 명시"
        - "그래프는 AI 생성이 아니라 코드 생성 또는 자막 대체 + 크레딧 동반"
  - id: transitions_output
    description: 전환 지정
    expected:
      checks:
        - "[{between:[2,3], type:'xfade', sec:0.25}] 형태로 산출"
        - "기본값은 하드컷이며 필요한 경계에만 지정"
  - id: guard_forbidden_prompt
    description: 실존 인물·언론사 지면을 프롬프트에 넣으려는 경우
    expected:
      checks:
        - "생성 금지 소재로 차단"
        - "data_card·추상 배경으로 대체 설계"
  - id: live_action_briefing
    description: 실촬영 경로 분기
    expected:
      checks:
        - "실촬영 검수 4항(간판·로고 / 제3자 얼굴 / 출연자 동의 / 의료기관 내부 촬영 금지)을 촬영 전 안내"
        - "role·출처 크레딧이 씬 표에 채워져 있어 assemble이 직접 읽을 수 있음"
