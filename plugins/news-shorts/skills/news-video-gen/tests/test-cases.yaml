name: news-video-gen
version: 0.1.0
test_cases:
  - id: happy_no_person
    description: 인물 없는 뉴스형 기획 (데이터 카드 위주)
    expected:
      checks:
        - "person_group 전 씬 — 를 정상으로 보고 무인물 모드 진행"
        - "캐스팅 시트를 요구하지 않음"
        - "data_card 씬은 배경만 생성"
  - id: gate_expiry
    description: expiry_date가 지났거나 없는 상태로 생성 요청
    expected:
      checks:
        - "생성을 시작하지 않음 (없음도 무기한이 아님)"
        - "news-verify 재실행 제안"
  - id: gate_missing_credit_or_role
    description: 근거 카드가 있는 씬에 출처 크레딧이 없거나 role 컬럼이 빔
    expected:
      checks:
        - "스토리보드로 되돌림"
        - "조립 지시서를 내지 않음"
  - id: gate_cost_approval
    description: 비용 승인 전
    expected:
      checks:
        - "비용 추정 고지 없이 생성 호출하지 않음"
        - "data_card·caution 씬은 스틸+켄번스 무비용 대안을 함께 제시"
        - "배정 초가 5초 초과인 씬은 상위 클립 단위로 계산"
        - "훅 씬 1개 테스트 생성 권장"
  - id: clip_duration_covers_scene
    description: 배정 6.0초 씬
    expected:
      checks:
        - "5초 클립으로 만들지 않음 — 10초로 올리거나 멀티컷 분할"
        - "trim_to 길이 >= cut_seconds 를 지시서 자체 검사로 확인"
  - id: person_consistency_chain
    description: 같은 person_group이 씬 2·6·9에 등장
    expected:
      checks:
        - "그룹별 앵커 스틸 1장 생성 후 승인 게이트"
        - "이후 씬은 앵커를 인물 참조로 전달"
        - "i2v 체인만 사용, text-to-video 직행 금지"
        - "P1 앵커를 P2 씬에 쓰지 않음"
  - id: person_extra_anchor_null
    description: 씬마다 다른 단역 (P1-a, P1-b)
    expected:
      checks:
        - "앵커를 만들지 않고 씬별 스틸 고정만 적용"
        - "person_anchor는 null이 정상 (필드 계약 위반이 아님)"
  - id: review_gate_records
    description: 클립 검수 결과 기록
    expected:
      checks:
        - "review 값이 pass|fail|manual 중 하나"
        - "2회 실패 시 실촬영·정지 이미지 전환 제안"
        - "파일을 열 수 없으면 manual로 기록하고 사용자 확인"
  - id: text_in_clip_regenerate
    description: 생성 클립에 글자·로고가 나옴
    expected:
      checks:
        - "검수에서 검출 후 재생성"
        - "프롬프트에 no text 계열 지시 강화"
  - id: multicut_contract
    description: guide 동작 씬이 2컷으로 쪼개짐
    expected:
      checks:
        - "같은 scene에 cut 1·2, cut_seconds 합 = 배정 초"
        - "파일명 scene4-1.mp4 규칙"
        - "나레이션은 cut 1에만, 나머지는 null — 단 cut 1 나레이션은 씬 구간 전체에 재생됨을 note로 전달"
        - "출처 크레딧은 씬 단위로 통 유지"
  - id: bridge_scene_in_clips
    description: 나레이션 없는 브리지 씬
    expected:
      checks:
        - "scene_timing과 clips[] 양쪽에 존재 (sequence에만 있으면 정합 검사 실패)"
        - "narration은 null, note에 '브리지 씬' 기록"
  - id: guard_forbidden_subject
    description: 실존 인물·기사 화면 생성 요청
    expected:
      checks:
        - "생성 금지 소재로 거절"
        - "data_card 대체 제안"
  - id: safety_filter_fallback
    description: 의료 묘사로 안전 필터 거부
    expected:
      checks:
        - "묘사를 추상화해 재시도"
        - "2회 실패면 data_card 씬으로 대체 제안"
  - id: instruction_contract
    description: 조립 지시서 필드 계약
    expected:
      checks:
        - "표에 없는 필드를 새로 만들지 않음 (character_id·scene·transitions 모두 표에 존재)"
        - "verification_bundle을 실어 전달 — 없으면 publish-kit이 막힘"
        - "caution_scene·caution_level 전달"
        - "scene_timing에 예상 초를 싣지 않음 (배정 초가 유일한 계약값)"
        - "assembly.transitions를 스토리보드 전환 가이드에서 그대로 옮김"
  - id: instruction_self_check
    description: 지시서 자체 정합 검사
    expected:
      checks:
        - "fact_cards 있는 씬의 source_credit이 null이 아님"
        - "sequence의 모든 씬이 scene_timing·clips 양쪽에 존재"
        - "씬별 cut_seconds 합 = assigned"
        - "trim_to 길이 >= cut_seconds"
        - "caution_scene의 role이 caution"
        - "하나라도 깨지면 지시서를 내지 않고 스토리보드로 되돌림"
