name: news-assemble
version: 0.1.0
test_cases:
  - id: happy_full_assembly
    description: 지시서·클립·나레이션이 모두 갖춰진 정상 조립
    expected:
      checks:
        - "렌더 전 5게이트(만료·크레딧 정합·경고 카드·review/실촬영 검수·검증 미실시) 통과 확인"
        - "자막 2층(Main + Credit) ASS 생성 후 번인"
        - "크레딧이 하단 안전영역 바로 위, 본문 자막과 겹치지 않음"
        - "총 길이 = (최종 씬 시간표 총합 − 전환 겹침 총합) ±0.5초"
        - "조립 리포트에 출처 크레딧 배치표·전환 겹침 총합·verification_bundle 포함"
  - id: gate_expired_or_missing
    description: expiry_date 경과 또는 부재
    expected:
      checks:
        - "렌더하지 않고 news-verify 재실행 제안"
  - id: gate_missing_credit
    description: 사실 문장이 있는 씬에 크레딧 없음
    expected:
      checks:
        - "AI 경로는 fact_cards 기준, 실촬영 경로는 씬 시간표 근거 카드 기준으로 판정"
        - "렌더하지 않고 news-storyboard로 되돌림"
  - id: gate_warning_card_routing
    description: 경고 카드 결손 유형별 되돌림 대상
    expected:
      checks:
        - "카드 자체가 없음 → news-verify"
        - "카드는 있으나 씬 배치 없음(caution_scene 없음) → news-storyboard"
        - "스토리보드엔 있는데 ASS 누락 → 자막 파일만 고쳐 재렌더"
        - "W-urgent인데 나레이션이 없으면 → news-script"
  - id: gate_live_action_review
    description: 실촬영 경로 (review 필드 없음)
    expected:
      checks:
        - "실촬영 검수 4항(간판·로고 / 제3자 얼굴 / 출연자 동의 / 의료기관 내부)을 사용자에게 제시하고 확인"
        - "확인 없이 렌더하지 않음"
  - id: gate_unverified_notice
    description: 대본에 '검증: 미실시'
    expected:
      checks:
        - "첫 씬 자막에 '검증되지 않은 정보' 고지가 있는지 확인"
        - "없으면 렌더하지 않고 스토리보드로 되돌림"
  - id: instruction_mismatch
    description: trim_to 길이가 cut_seconds보다 짧음
    expected:
      checks:
        - "빈 구간이 생기므로 news-video-gen으로 되돌림"
        - "sequence에 있는데 clips에 없는 씬도 같은 처리"
  - id: review_gate_exclusion
    description: review가 fail인 클립 존재
    expected:
      checks:
        - "해당 클립을 조립에서 제외"
        - "씬 시간표에서 행을 빼고 총 길이 재합산, 갱신본이 정본"
        - "제외 씬이 팩트 카드를 소비하던 씬이면 선택지 제시"
        - "② 인접 씬 이동은 인접 클립 duration에 5% 이내 여유가 있을 때만 제시"
  - id: length_tolerance
    description: 나레이션 실측이 배정 초보다 9% 김
    expected:
      checks:
        - "생성 후 실측이므로 assemble이 처리 (생성 전이면 storyboard 담당)"
        - "atempo가 아니라 trim_to 조정으로 처리"
        - "duration에 여유가 없으면 15% 초과와 같이 사용자 선택으로 넘어감"
        - "씬 시간표 갱신 + 리포트에 조정 수치 명시"
  - id: transition_compensation
    description: xfade 전환 3곳 지정 (총 0.75초 겹침)
    expected:
      checks:
        - "각 씬 시작 시각을 앞선 전환 겹침 누적만큼 앞당김"
        - "자막·크레딧·나레이션 adelay를 보정된 시각으로 계산"
        - "총 길이 검증 기준에서 겹침 총합을 차감"
        - "transitions가 비어 있으면 하드컷·보정 없음"
  - id: subtitle_split
    description: 한 씬 자막이 ' / '로 2줄
    expected:
      checks:
        - "본문 자막은 씬 구간을 2등분해 순서대로 배치"
        - "출처 크레딧은 씬 구간 통으로 유지"
  - id: caution_style
    description: W-urgent 경고 씬
    expected:
      checks:
        - "폰트 1.4배 + 화면 전체 정지 + 배경 딤"
        - "켄번스(zoompan) 적용하지 않음"
        - "나레이션 유무를 렌더 후 별도 확인"
  - id: live_action_path
    description: 실촬영 클립, 조립 지시서 없음
    expected:
      checks:
        - "스토리보드 10컬럼 표 + 씬 시간표를 직접 입력으로 사용"
        - "출처 크레딧·role을 스토리보드 컬럼에서 직접 읽음"
        - "trim 구간을 사용자에게 확인 (기본 제안: 앞 0.3초 버리고 배정 초)"
  - id: timing_fallback
    description: 실측 초 컬럼이 비어 있음
    expected:
      checks:
        - "배정 초를 계약값으로 사용 (예상 초를 쓰지 않음)"
  - id: audio_levels
    description: 오디오 믹스 기준값
    expected:
      checks:
        - "나레이션 트랙을 -16 LUFS로 정규화, 피크 -3dBTP 이하"
        - "최종 믹스 -14 LUFS 내외, 피크 -1dBTP 이하"
  - id: font_check
    description: 한글 폰트 미설치 환경
    expected:
      checks:
        - "폰트 없이 렌더하지 않고 설치 후 진행"
  - id: credit_coverage_check
    description: 렌더 후 검수
    expected:
      checks:
        - "fact_cards가 있는 모든 씬 구간에서 프레임을 뽑아 크레딧 표시 확인"
        - "caution_scene 구간 프레임에서 경고 문구 확인"
        - "하나라도 비면 자막 파일 수정 후 재렌더"
  - id: guard_third_party_footage
    description: 뉴스 화면을 소재로 넣어달라는 요청
    expected:
      checks:
        - "거절 + 분석 전용 원칙 안내"
