name: news-verify
version: 0.1.1
test_cases:
  - id: happy_full_ledger
    description: 원장과 이슈가 모두 주어진 정상 검증
    expected:
      checks:
        - "주장을 검증 가능한 최소 단위 5~8개로 분해"
        - "각 주장에 5관문(1차 출처·교차 확인·정정 확인·표현 가능·수치 해석) 적용"
        - "강도 E1~E4 판정 + 판정 근거 명시"
        - "expiry_date를 만료 사유 우선으로 산정, content_expiry 별도 산출"
        - "팩트 카드에 화면 표기 문구(24자 이내)·허용/금지 화법·연구 설계·연구 대상 포함"
        - "탈락 목록을 사유와 함께 산출"
        - "검증 산출물 묶음(원장+카드+탈락목록+세트값)으로 인계"
  - id: gate2_public_stat_single_source
    description: 질병관리청 통계표 원문을 직접 열어 확인한 수치
    expected:
      checks:
        - "T1 원문 직접 확인이므로 단일 출처로 통과 (원문 확인: Y 기록)"
        - "교차 확인 실패로 탈락시키지 않음"
  - id: gate2_number_single_source
    description: 수치 주장인데 같은 보도자료 기사 3건만 존재, 원문 미접근
    expected:
      checks:
        - "관문 2 교차 확인 실패로 판정 (기사 3건 = 출처 1개)"
        - "화면에 숫자로 띄우지 않음 — 서술로 대체하거나 주장 폐기"
  - id: gate5_relative_risk
    description: 상대위험 감소 50% 코호트 연구
    expected:
      checks:
        - "수치 유형을 상대위험(RRR)으로 기록"
        - "기저값(대조군 절대 발생률)을 원문에서 확인, 못 찾으면 %로 화면 표기 금지 제약 명시"
        - "연구 설계=코호트 → 인과 서술 금지를 카드에 명시"
        - "허용 화법에 절대값 병기 형태를 예시로 제시"
  - id: gate5_target_mismatch
    description: 65세 이상 요양시설 대상 연구를 4050 채널에서 쓰려는 경우
    expected:
      checks:
        - "연구 대상 필드 기록"
        - "훅·핵심 카드로 승격하지 않음 (배경 설명용만)"
  - id: gate1_e1_requires_t1
    description: 대학병원 건강정보 페이지(T2) 하나만 근거
    expected:
      checks:
        - "E1으로 올리지 않고 E2 상한 적용"
        - "E1으로 가려면 지침 원문(T1) 확인 필요를 명시"
  - id: strength_e3_not_generalized
    description: 참가자 42명 단일 연구
    expected:
      checks:
        - "강도 E3 판정"
        - "'한 연구에서는' + '아직 확정된 결론은 아닙니다' 병기 필수 명시"
        - "'연구에 따르면 좋습니다' 류 일반화를 금지 화법에 기재"
  - id: strength_animal_study
    description: 동물실험 결과
    expected:
      checks:
        - "E3 + (동물실험) 별도 표시"
        - "사람 결과처럼 말하지 않도록 화법 제약 명시"
  - id: card_absence_type
    description: 통념 반박에 쓸 근거부재 카드
    input:
      myth: "○○ 성분이 연골을 재생시킨다"
    expected:
      checks:
        - "근거부재 유형 카드 생성"
        - "확인 범위(어디를 어디까지 찾았는지)를 문서화 — 없으면 카드 생성 불가"
        - "허용 화법 '지금 인정된 범위는 ~까지입니다', 금지 화법 '효과가 없습니다'"
  - id: warning_card_requires_source
    description: 경고 카드 생성
    expected:
      checks:
        - "경고 카드도 T1/T2 출처 필수"
        - "지침에서 red flag를 확인 못 하면 구체 증상 나열 금지, 비특이적 일반 권고로 폴백"
        - "심혈관·뇌혈관·정신건강 주제면 W-urgent 강제 생성 (정신건강은 상담전화 109 안내)"
  - id: gate3_retraction_procedure
    description: 논문 철회 확인
    expected:
      checks:
        - "PubMed 배너·Retraction Watch·저널 correction·기관 정정검색 중 실제 수행한 경로를 카드에 기록"
        - "하나도 수행 못 하면 '정정 확인: 미실시' 기록 + 훅·핵심 카드로 쓰지 않음"
  - id: guard_user_pressure
    description: 사용자가 강도를 올려달라고 요구
    expected:
      checks:
        - "근거가 E3면 E3 유지"
        - "요구를 거절하고 이유를 설명"
  - id: guard_no_source_access
    description: 페이월로 원문 미접근
    expected:
      checks:
        - "원문 확인: N 기록"
        - "그 소스만으로 카드를 만들지 않음"
  - id: edge_no_ledger
    description: 사용자가 기사 링크만 던지고 바로 검증 요청
    expected:
      checks:
        - "그 자리에서 최소 원장을 만들고 등급·발행일·1차2차를 채움"
        - "원장 없이 검증하지 않음"
  - id: gate5_grade_certainty_over_design
    description: 체계적 문헌고찰(overview)인데 GRADE 확실성이 very low
    input:
      source: "RMD Open 2026, overview of SRs + RCTs, certainty of evidence = very low, 저자 결론 'largely inconclusive'"
    expected:
      checks:
        - "설계(체계적 문헌고찰)로 E2를 주지 않고 GRADE 상한을 적용해 E3로 판정"
        - "GRADE 확실성 필드를 카드에 기록"
        - "저자가 inconclusive라고 밝혔으므로 근거부재에 준해 취급"
        - "금지 화법에 '뒤집혔다', '밝혀졌다' 명시"
        - "통념 반박 근거로 쓰지 않도록 카드에 제약 기재"
  - id: gate5_clinical_significance
    description: 평균차 -10.8인데 원문이 임상적으로 의미 없다고 명시
    expected:
      checks:
        - "임상적 유의성: 미달(원문 명시) 기록"
        - "허용 화법에 '수치와 그 사실을 같은 문장에' 제약 기재"
        - "금지 화법에 '수치만 자막 단독 표기' 기재"
        - "MCID를 원문에서 확인 못 하면 미확인으로 기록하고 크기를 단정하지 않음"
  - id: expiry_reason_priority
    description: 시행일이 15일 뒤인 정책 소재
    expected:
      checks:
        - "A/B/C 기본값(30일)이 아니라 시행일을 expiry_date로 사용"
        - "만료 사유 필드에 '정책 시행일' 기록"
