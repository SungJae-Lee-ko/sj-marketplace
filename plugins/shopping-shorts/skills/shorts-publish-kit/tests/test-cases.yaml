name: shorts-publish-kit
version: 0.7.0
test_cases:
  - id: happy_full_chain
    description: 체인 완주 후 발행 키트 생성
    input:
      chain: "script→storyboard→video-gen 완료, AI 클립 포함, 판매 형태=제휴"
    expected:
      checks:
        - "산출물 5종 모두 존재(제목3안·설명·해시태그·고정댓글·체크리스트)"
        - "제목 3안이 서로 다른 방향(검색형/호기심형/타깃호명형)"
        - "제목에 #shorts 없음, 설명란에 있음"
        - "제휴 수수료 표기 문구 설명문에 포함"
        - "체크리스트에 합성 콘텐츠 공개 설정 항목 포함"
        - "해시태그 10-15개, 대형3+중형5+니치5 비율"
  - id: edge_standalone_call
    description: 체인 없이 단독 호출(제목만 요청)
    input:
      request: "제목만 뽑아줘"
    expected:
      checks:
        - "5종 강제하지 않고 요청 범위만 산출"
        - "판매 형태 미확인 시 제휴 여부 1회 확인"
  - id: happy_affiliate_disclosure_both
    description: 제휴 마케팅 영상의 고지 위치
    input:
      content_type: "sales"
      sales_form: "쿠팡 파트너스"
    expected:
      checks:
        - "수수료 고지 문구가 설명란에 포함"
        - "수수료 고지 문구가 고정댓글에도 포함 (구매 링크와 같은 댓글 안)"
        - "설명란 고지가 첫 3줄 안에 배치"
        - "체크리스트에 양쪽 고지 확인 항목 존재"
  - id: happy_habit_kit
    description: 습관·정보형 발행 키트
    input:
      content_type: "habit"
      sales_form: null
    expected:
      checks:
        - "제휴 수수료 고지를 넣지 않음"
        - "고정댓글에 동작 요약 3줄과 안전 주의 문구 포함"
        - "제목·설명에 치료·완치 등 의료 단정 표현 없음"
        - "해시태그 니치 구간에 증상·동작·연령대 태그 배치"
  - id: edge_habit_with_affiliate
    description: habit으로 표기됐는데 제휴 링크가 함께 들어옴
    input:
      content_type: "habit"
      link: "쿠팡 파트너스 링크"
    expected:
      checks:
        - "유형 불일치를 지적하고 판매형 고지 요건 적용 여부를 1회 확인"
        - "확인 없이 고지를 생략하지 않음"
