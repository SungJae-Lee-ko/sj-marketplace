name: shorts-storyboard
version: 0.8.0
test_cases:
  - id: happy_mixed_mode
    description: 30초 판매형 스크립트 → 혼합(실촬영+AI) 스토리보드
    input:
      content_type: "sales"
      script: "확정된 30초 스크립트"
      mode: "혼합"
      reference_a: "제품 실사진"
    expected:
      checks:
        - "씬 수 7-12개, 씬당 2-5초"
        - "표에 고정 8컬럼(#·시간·화면 구성·앵글/무빙·나레이션·자막·오디오·person_group) 모두 존재"
        - "표 아래에 샷 플랜(샷 ID·씬 범위·길이·연결 방식·공통 스타일 프리픽스) 산출"
        - "AI 프롬프트가 씬별이 아니라 샷별로 산출되고 참조 매핑(A 직접 참조/person/chain) 포함"
        - "AI 샷 프롬프트에 vertical 9:16 포함"
        - "자막 배치가 references/youtube-shorts-specs.md 안전영역 준수"
        - "제품 클로즈업 씬 40% 이상"
  - id: happy_shot_plan_rules
    description: 샷 그룹핑 규칙 준수
    input:
      content_type: "sales"
      script: "확정 35초, 훅 + 주방 사용 3씬 + 야외 상황 2씬 + CTA"
      mode: "AI 생성"
    expected:
      checks:
        - "훅은 단독 샷으로 분리"
        - "같은 공간(주방) 연속 씬은 한 샷으로 묶임 (샷당 2-3씬, 8-15초)"
        - "공간 전환(주방→야외) 지점에서 샷 분리, 연결 방식 cut/transition 지정"
        - "샷 길이 = 묶인 씬 배정 초 합계"
        - "공통 스타일 프리픽스 한 줄이 전 샷 프롬프트에 동일 적용"
  - id: edge_b_as_source
    description: 상황 자료(B)만 있고 제품 자료(A) 없음
    input:
      reference_b: "경쟁 제품이 크게 보이는 캠핑 사용 장면"
    expected:
      checks:
        - "B를 생성 소스·참조로 쓰지 않음 (타사 제품 노출 자료)"
        - "B에서 배경·무드만 추출, 타사 제품 형태·로고 미반영"
        - "A 요청 안내 1회"
  - id: happy_official_b_video_ref
    description: 사용권 확인된 공식 영상(B)을 모션 참조로 지정
    input:
      reference_a: "제품 실사진 3장"
      reference_b: "제조사 공식 홍보 영상 (사용권 확인)"
    expected:
      checks:
        - "샷 프롬프트 참조 매핑에 video_references(모션·무드)로 지정"
        - "타인 영상이었다면 분석 전용으로만 사용 (참조 지정 금지)"
        - "제품의 정답지는 여전히 A (충돌 시 A 우선)"
  - id: edge_no_script
    description: 스크립트 없이 호출
    input: {}
    expected:
      checks:
        - "shorts-script 선행을 제안하고 임의 진행하지 않음"
  - id: happy_fixed_columns
    description: 씬 표가 고정 8컬럼으로 산출되는가
    input:
      script: "확정 스크립트 + 문장 단위 나레이션 시간표"
      mode: "혼합"
    expected:
      checks:
        - "컬럼이 #·시간·화면 구성·앵글/무빙·나레이션·자막·오디오·person_group 8개"
        - "나레이션 컬럼이 씬마다 채워짐 (없는 씬은 —)"
        - "씬 시간이 나레이션 시간표에서 계산된 값과 일치하고, 씬 시간표를 함께 산출"
        - "표 아래에 content_type과 총 길이 명시"
  - id: happy_person_group
    description: 같은 인물이 2개 이상 씬에 등장
    input:
      script: "씬 2 랠리·씬 8 하이파이브에 같은 부부"
    expected:
      checks:
        - "씬 2와 씬 8에 동일한 person_group ID(P1) 부여"
        - "산문으로 '씬 2·8은 같은 부부'라고만 쓰지 않음"
        - "캐스팅 시트에 P1의 인물 수·연령대·의상 고정"
        - "인물 씬 프롬프트에 연속 테이크 문구 포함"
  - id: happy_habit_scene_rules
    description: 습관형 스토리보드 씬 규칙
    input:
      content_type: "habit"
      script: "동작 3개 35초"
    expected:
      checks:
        - "동작 시연 씬 40% 이상 (상품 클로즈업 규칙은 미적용)"
        - "동작마다 정면·측면 2각도 확보"
        - "잘못된 자세 씬은 바른 자세 씬과 인접 배치 + ❌/⭕ 자막 구분"
        - "안전 주의 문구를 자막 컬럼에 1회 이상 배치"
        - "동작마다 횟수·시간 카운트 자막(10회 × 3세트 등)을 자막 컬럼에 기재"
        - "동작 시연 씬은 실촬영 우선 권장 안내"
  - id: edge_live_action_branch
    description: 실촬영으로 확정된 프로젝트의 다음 단계 안내
    input:
      mode: "실촬영"
    expected:
      checks:
        - "shorts-assemble로 체이닝 제안 (publish-kit 직행 아님)"
        - "촬영 후 클립을 연결 폴더에 넣어달라는 안내 포함"
  - id: happy_scene_timing_table
    description: 씬 단위 씬 시간표를 확정하는가 (이 스킬의 계약 산출물)
    input:
      narration_timing: "문장 N1~N6, 예상 초 합계 28.4초, 목표 35초"
      mode: "혼합"
    expected:
      checks:
        - "[씬 · 구간 · 포함 문장 · 예상 초 · 배정 초 · 실측 초] 표를 씬 표 아래에 산출"
        - "한 문장이 두 씬으로 쪼개지지 않음"
        - "나레이션 없는 씬은 1.5~3초로 배정"
        - "배정 초 합계 = 스크립트 총 길이"
        - "씬 표의 나레이션 컬럼에 문장 ID(N2 등) 병기"
  - id: happy_pre_tts_recommendation
    description: 클립 생성 전 선(先) 나레이션 생성을 권장하는가
    input:
      next_step: "AI 생성"
    expected:
      checks:
        - "video-gen 진입 전에 TTS 선생성을 제안"
        - "크레딧 소모 고지·승인 절차 안내"
        - "실측이 예상치와 어긋나면 씬 시간표 배정 초를 먼저 고치고 생성으로 감"
  - id: edge_affiliate_no_ai_product
    description: 제휴·협찬 상품의 AI 재생성 제한이 전달되는가
    input:
      content_type: "sales"
      sales_form: "affiliate"
    expected:
      checks:
        - "제품 컷을 AI로 재생성하지 않는다는 제약을 씬 표 아래에 명시"
        - "AI는 배경·상황 씬에만 배정"
        - "sales_form 값을 그대로 다음 스킬로 전달"
  - id: edge_example_not_copied
    description: 예시 씬을 그대로 베끼지 않는가
    input:
      script: "2인용 라켓 세트 판매형"
    expected:
      checks:
        - "랠리·스매시 같은 연속 행위를 씬 지문에 쓰지 않음"
        - "인물 씬을 행위 정점 1프레임 + 저위험 무빙으로 설계"
        - "씬 길이가 2-5초 기본 범위를 지킴 (3초 규칙은 화면 유지 규칙으로 별도 적용)"
