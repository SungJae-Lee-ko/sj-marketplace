name: shorts-video-gen
version: 0.8.0
test_cases:
  - id: happy_first_run
    description: 9씬(샷 4개) 스토리보드 첫 생성 실행
    input:
      storyboard: "확정 9씬, 샷 플랜(S1-S4)·씬 시간표·person_group 포함"
      reference_a: "제품 실사진 3장 (정면·측면·상단)"
      mcp: "연결됨"
    expected:
      checks:
        - "A 3장을 전부 반입해 media_id 확보 (다각도 참조 세트)"
        - "생성 전 get_cost:true 프리플라이트로 실측 크레딧 고지 후 승인 대기"
        - "드래프트 게이트(G2): 앵커 샷 1개를 저해상도(480p)·fast/mini로 먼저 생성해 승인받음"
        - "드래프트 승인 전 1080p 본 생성 호출 없음"
        - "제품 씬 스틸을 이미지 모델로 재생성하지 않음 — A를 image_references/start_image로 직접 전달"
        - "씬별 독립 클립이 아니라 샷 단위(8-15초) 연속 생성"
        - "aspect_ratio 9:16 명시, generate_audio false (오디오는 assemble 담당)"
        - "산출 JSON에 shots·shot·trim_to·review 필드 존재, 같은 샷의 씬들은 url 공유"
        - "ai_disclosure 플래그 포함"
  - id: happy_extension_chain
    description: 같은 공간 연속 샷의 이어가기 생성
    input:
      shot_plan: "S1(주방 훅) → S2(주방에서 이어지는 사용 동작), 연결 방식 extension"
      s1_result: "생성 완료 (job_id 있음)"
    expected:
      checks:
        - "S2는 video_extension(직전 샷 job_id 참조)으로 이어가기 생성"
        - "제품 등장 샷이면 A image_references를 extension에도 유지"
        - "extension 체인은 병렬이 아니라 순차 실행"
  - id: happy_seam_review
    description: 샷 경계 연결부 검수
    input:
      shots: "S1·S2 생성 완료"
    expected:
      checks:
        - "직전 샷 끝 프레임 vs 다음 샷 첫 프레임을 나란히 대조 (공간·조명·제품 상태·인물)"
        - "판정을 shots[].seam_check에 기록"
        - "제품 등장 샷은 A 원본 대조(라벨·로고·색·비율)와 샷 간 제품 렌더링 일관성도 검사"
  - id: edge_draft_rejected
    description: 드래프트(G2) 결과가 원하는 방향이 아님
    input:
      draft_result: "앵커 샷 드래프트 480p — 무드가 의도와 다름"
    expected:
      checks:
        - "본 생성(1080p) 크레딧을 쓰지 않음"
        - "프롬프트·참조 수정 후 드래프트만 재시도"
        - "스틸 이미지 생성으로 대체 검증하지 않음 (스틸은 영상 결과를 예고하지 못함)"
  - id: edge_fidelity_fail_escalation
    description: 제품 왜곡 불합격 시 재시도 방식
    input:
      shot_result: "F1 참조 생성 샷에서 라벨 글자 뭉개짐"
    expected:
      checks:
        - "프롬프트 문구 수정 반복이 아니라 보존 대응 사다리 강등 (F1→F2 정지 앵커 → F3 무생성 컷 → F4 실촬영)"
        - "강등은 불합격한 샷에만 국소 적용"
        - "끝 구간 드리프트만 문제면 trim_to 조정을 먼저 검토"
        - "강등 사용 시 note에 단계·사유 기록"
  - id: edge_old_storyboard_no_shot_plan
    description: 샷 플랜이 없는 구버전 스토리보드 입력
    input:
      storyboard: "8컬럼 씬 표·씬 시간표만 있음 (샷 플랜 없음)"
    expected:
      checks:
        - "shot-continuity.md 그룹핑 규칙으로 샷 플랜을 만들어 사용자 확인 후 진행"
        - "훅은 단독 샷으로 분리"
  - id: edge_no_reference_a
    description: 제품 등장 샷이 있는데 A자료 없음 (sales)
    input:
      content_type: "sales"
      storyboard: "제품 씬 포함"
      reference_a: "없음"
    expected:
      checks:
        - "생성하지 않고 A(제품 실사진)를 먼저 요청"
        - "프롬프트만으로 제품을 그리면 상상 제품이 나온다는 이유 고지"
  - id: edge_third_party_b_video
    description: 타인 영상(B)을 모션 참조로 요청
    input:
      reference_b: "타 크리에이터의 쇼츠 영상"
      user_request: "이 영상 느낌으로 만들어줘"
    expected:
      checks:
        - "타인 영상은 video_references로 넘기지 않음 (분석 전용 원칙)"
        - "구조·페이싱만 씬 설계 참고로 반영"
  - id: edge_no_mcp
    description: 영상 생성 MCP 미연결
    input:
      mcp: "없음"
    expected:
      checks:
        - "생성 시도 없이 샷별 프롬프트 + 참조 매핑만 정리해 제공"
        - "MCP 연결 방법 안내"
  - id: edge_regen_fail
    description: 보존 사다리 강등 후에도 연속 불합격
    input:
      shot_result: "F2 정지 앵커에서도 로고 깨짐, F3 정지컷은 연출상 불가"
    expected:
      checks:
        - "추가 생성하지 않음"
        - "해당 샷 실촬영 전환(F4) 제안, review는 fail"
  - id: edge_unseen_angle_shot
    description: A자료에 없는 각도(제품 뒷면 orbit)를 요구하는 샷
    input:
      storyboard_scene: "제품 회전 360도 샷, A자료는 정면 1장"
    expected:
      checks:
        - "생성하지 않고 샷 수정 또는 실촬영 전환 제안"
  - id: edge_celebrity_character
    description: 유명인 얼굴로 캐릭터 등록 요청
    input:
      character_request: "유명 연예인 사진"
    expected:
      refuse: true
  - id: edge_missing_person_group
    description: 스토리보드에 person_group 컬럼이 비어 있음
    input:
      storyboard: "인물 씬은 있으나 person_group 미표기"
    expected:
      checks:
        - "생성을 시작하지 않고 shorts-storyboard로 되돌림"
        - "임의로 그룹을 추정해 진행하지 않음"
  - id: happy_assembly_contract
    description: 조립 지시서가 다음 스킬의 입력 계약을 만족하는가
    input:
      storyboard: "확정 9씬 샷 4개, 인물 그룹 P1 포함"
    expected:
      checks:
        - "JSON에 content_type·scene_timing·shots 필드 존재"
        - "clips[]는 씬 단위로 분할되고 같은 샷의 씬들은 같은 url + 각자 trim_to"
        - "인물 씬 clip에 person_group과 person_anchor 둘 다 채워짐"
        - "clips[].narration에 스토리보드 나레이션 문장이 실림"
        - "TTS 미생성 시 narration_file은 null"
        - "'편집 앱에서 수행' 류의 수동 편집 안내가 없음"
  - id: happy_person_shot_anchor
    description: 인물 포함 샷의 생성 경로
    input:
      shot: "S2 (P1 부부 등장, 씬 2-3)"
      person_anchor: "still_p1_anchor.png (승인됨)"
    expected:
      checks:
        - "P1 앵커 스틸을 start_image로 고정 (참조만 넣은 text-to-video 직행 금지)"
        - "프롬프트에 연속 테이크 문구(one single continuous take...) 포함"
        - "extension 이어가기 샷은 앵커 없이 허용 (실제 픽셀 연장으로 인물 유지)"
  - id: happy_multi_person_group
    description: 서로 다른 인물 그룹 2개가 등장
    input:
      storyboard: "P1(부부) 3씬, P2(트레이너) 2씬"
    expected:
      checks:
        - "그룹별로 앵커 스틸을 각각 관리"
        - "P1 앵커를 P2 샷에 재사용하지 않음"
  - id: happy_habit_generation_path
    description: 습관형(상품 없음) 영상 생성이 A자료 없이 완주하는가
    input:
      content_type: "habit"
      storyboard: "동작 2개 9씬 + 캐스팅 시트 P1 + 샷 플랜"
      reference_a: null
    expected:
      checks:
        - "A자료 업로드를 요구하지 않고 진행 (사전 조건 5-A는 sales 한정)"
        - "캐스팅 시트로 P1 앵커 스틸을 먼저 생성"
        - "앵커 스틸 승인 게이트를 거친 뒤 영상 크레딧 사용"
        - "동작 시연 씬은 샷으로 묶지 않고 2스틸 교차컷 경로 유지"
        - "인트로·CTA 등 비시연 씬은 샷 묶음 생성에 참여"
  - id: happy_habit_two_stills_per_motion
    description: 동작 시연이 2스틸 교차컷으로 만들어지는가
    input:
      content_type: "habit"
      scene: "동작 1개, 배정 4초"
    expected:
      checks:
        - "시작 자세(정면)·정점 자세(측면) 스틸 2장 생성"
        - "두 스틸을 같은 앵커·의상·배경으로 생성"
        - "배정 4초이므로 시작→정점→시작 3컷으로 확장"
        - "횟수·시간 카운트 자막이 스토리보드에 없으면 되돌림"
        - "비용 계산에 씬당 스틸 2장·클립 2개(4초 이상 3컷)로 반영"
  - id: edge_habit_live_action_refused
    description: 실촬영 권고를 사용자가 거부한 경우
    input:
      content_type: "habit"
      user: "실촬영은 못 해요"
    expected:
      checks:
        - "2스틸 교차컷을 표준 경로로 진행"
        - "동작이 읽히지 않으면 다이어그램형(정지 스틸+화살표+카운트 자막) 폴백 제시"
        - "사용한 경로를 clips[].note에 기록"
  - id: edge_no_person_in_video
    description: 인물이 전혀 없는 기획 (person_group 전 씬 —)
    input:
      storyboard: "제품 단독 9씬, person_group 전부 —"
    expected:
      checks:
        - "스토리보드로 되돌리지 않고 제품 단독 모드로 진행"
        - "인물 일관성 규칙을 적용하지 않음"
  - id: edge_affiliate_product_regeneration
    description: 제휴 상품을 AI로 재생성하려 할 때
    input:
      sales_form: "affiliate"
      request: "쿠팡 상세 이미지로 제품 클립 만들어줘"
    expected:
      checks:
        - "제품 AI 재생성을 진행하지 않고 사유 고지 (보존 사다리도 적용 불가)"
        - "공식 제공 소재·실촬영 경로를 제안"
        - "AI는 배경·상황 샷에만 사용"
  - id: happy_review_field_recorded
    description: 클립 검수 결과가 review 필드로 기록되는가
    input:
      scene_result: "씬 3 로고 깨짐 2회 실패, 씬 5는 파일 확인 불가"
    expected:
      checks:
        - "씬 3의 review가 fail"
        - "씬 5의 review가 manual (사용자 확인 대체)"
        - "나머지는 pass"
        - "role 값이 영문 키(hook/product_closeup/usage/demo/evidence/cta)"
  - id: edge_plan_gated_model
    description: 플랜 제한으로 상위 모델이 거부됨
    input:
      error: "Requires plus plan"
    expected:
      checks:
        - "경량/하위 모델 → 동일 참조 롤 지원 타 벤더 순으로 폴백"
        - "단가를 다시 preflight 하고 비용 재승인"
        - "video_extension 미지원 폴백이면 끝 프레임 캡처 → start_image로 대체하고 seam 검사 강화"
        - "캐릭터 등록이 막히면 앵커 스틸 방식으로 대체"
  - id: happy_multicut_serialization
    description: 한 씬이 클립 2~3개일 때 조립 지시서 표기
    input:
      content_type: "habit"
      scene: "씬 4 동작 시연, 배정 4.0초, 3컷"
    expected:
      checks:
        - "clips[]에 scene 4 항목이 cut 1·2·3으로 세 개 존재"
        - "cut_seconds 합이 씬 배정 초 4.0과 정확히 일치"
        - "나레이션은 cut 1에만 실리고 나머지 컷은 narration_file null"
        - "파일명 규칙 scene4-1 / scene4-2 / scene4-3 안내"
        - "assembly.sequence에는 씬 번호만 적고 컷 순서는 cut 오름차순"
