name: shorts-script
version: 0.7.1
test_cases:
  - id: happy_full_input
    description: 상품·타깃·레퍼런스 모두 제공 시 정상 스크립트 생성
    input:
      product: "무선 미니 가습기, 2만원대"
      target: "사무실 직장인"
      reference: "제품 실사진 1장(A), 벤치마킹 쇼츠 스크린샷 1장(C)"
    expected:
      checks:
        - "0단계 레퍼런스 질문을 건너뛰고 받은 자료의 A/C 분류 확인"
        - "스타일 프로필을 제시하고 사용자 확인 후 진행"
        - "훅 2안 제시"
        - "구조 5단계(훅-문제-해결-증거-CTA) + 초 단위 타임코드"
        - "나레이션과 자막 분리 표기"
        - "셀링포인트 2개 이하"
  - id: edge_minimal_input
    description: 상품명만 주었을 때
    input:
      product: "수제 도자기 머그"
    expected:
      ask_user_clarification: true
      questions_about: ["레퍼런스 유무", "타깃", "셀링포인트", "목적(길이 매트릭스용)"]
      proceed_only_after_answers: true
  - id: edge_style_conflict
    description: 레퍼런스 스타일이 금지사항(과장 표현)과 충돌
    input:
      reference: "'100% 효과' 문구를 쓰는 벤치마킹 쇼츠"
    expected:
      checks:
        - "금지사항이 우선 적용됨"
        - "충돌 사실을 사용자에게 고지"
  - id: happy_category_supplement
    description: 건강식품 카테고리 브리프 적용
    input:
      product: "유산균 영양제"
      category: "건강식품"
    expected:
      checks:
        - "category-briefs.md 건강식품 브리프 적용 (타깃 호명형 훅 우선)"
        - "질병 예방·치료 표현 없음 (면역력·다이어트 등)"
        - "산출 후 금지 표현 자체 점검 결과 표기"
  - id: happy_diagnose_mode
    description: 기존 스크립트 진단 요청
    input:
      request: "이 스크립트 조회수 안 나와, 진단해줘"
      script: "안녕하세요 여러분~ 오늘은 신제품 소개할게요. 특징은 5가지인데요..."
    expected:
      checks:
        - "생성이 아닌 진단 모드로 동작"
        - "100점 채점표 + 항목별 근거 인용"
        - "훅 감점(인사말 시작)과 셀링포인트 감점(5개 나열) 검출"
        - "최우선 수정 1개 + 구체 교체안 제시"
        - "임의 재작성하지 않고 재작성 여부를 제안으로 물음"
  - id: happy_habit_type
    description: 상품 없는 습관·정보형 요청 (채널 주력 유형)
    input:
      topic: "무릎 지키는 3분 습관"
      target: "계단이 무서워진 40-50대"
      product: null
    expected:
      checks:
        - "content_type을 habit으로 판별하고 산출물 머리에 명시"
        - "[습관·정보형] 브리프 적용, 상품 카테고리 브리프는 미적용"
        - "습관형 5단계(훅-통념깨기-방법-근거주의-실행CTA) 사용"
        - "동작 3개 이하, 동작마다 이름·횟수·주의 3요소 포함"
        - "안전 주의 문구 1개 이상 포함"
        - "CTA가 실행 유도이며 구매·제휴 링크 없음"
        - "치료·완치·예방 등 의료 단정 표현 없음"
        - "산출 후 의료 단정 표현 자체 점검 결과 표기"
  - id: edge_type_ambiguous
    description: 습관 주제인데 마지막에 제품을 얹는 혼합 요청
    input:
      topic: "무릎 습관 알려주고 마지막에 폼롤러 링크 붙여줘"
    expected:
      checks:
        - "판매형(sales)으로 처리"
        - "훅·구조는 습관형을 쓰되 CTA만 판매형으로 간다고 고지"
        - "제휴 고지 의무가 발생함을 안내"
  - id: happy_narration_timing_table
    description: 나레이션 시간표가 문장 단위로 산출되는가 (씬 시간표는 만들지 않는다)
    input:
      script_request: "35초 습관형"
    expected:
      checks:
        - "문장 ID(N1, N2 …)가 붙은 [문장 → 구간 → 음절수 → 예상 초] 표를 산출"
        - "예상 초 = 음절수 ÷ 4.5 + 0.4 공식 적용"
        - "씬 단위 배정 초 컬럼을 만들지 않음 (씬 확정은 shorts-storyboard 책임)"
        - "총 길이 초과 시 시간을 늘리지 않고 나레이션 문장을 줄임"
        - "±5% 등 자체 허용 오차를 새로 정의하지 않음 (기준은 shorts-assemble 하나)"
  - id: happy_sales_form_capture
    description: 판매 형태가 체인 값으로 확정되는가
    input:
      product: "쿠팡 파트너스로 소개할 무릎 보호대"
    expected:
      checks:
        - "sales_form을 affiliate로 확정하고 산출물 머리에 명시"
        - "제휴 시 제품 AI 재생성 제한이 하류로 전달됨을 안내"
        - "habit 요청이면 sales_form: null이 정상"
  - id: edge_ai_scene_length_not_multiple_of_5
    description: AI 생성 씬이 있어도 씬 길이를 5초 배수로 맞추지 않는가
    input:
      script_request: "3초 훅 + AI 생성 씬 포함 30초"
    expected:
      checks:
        - "훅 길이를 3초로 유지 (5초로 늘리지 않음)"
        - "생성은 5초 단위, 사용은 트림이라고 안내"
  - id: edge_hook_reference_by_id
    description: 훅 참조가 고정 ID로 이뤄지는가
    input:
      product: "유산균 영양제"
    expected:
      checks:
        - "훅을 H1~H8 ID로 지정 (순번 '④' 식 표기 사용 안 함)"
